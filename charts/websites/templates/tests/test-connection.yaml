{{- $firstSvc := index .Values.services 0 -}}
{{- $firstPort := index $firstSvc.ports 0 -}}
{{- $svcName := printf "%s-%s" (include "websites.fullname" .) $firstSvc.name | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "websites.fullname" . }}-test-connection"
  labels:
    {{- include "websites.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: {{ include "websites.serviceAccountName" . }}
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['http://{{ $svcName }}:{{ $firstPort.port }}']
  restartPolicy: Never
