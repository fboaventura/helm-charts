{{- if .Values.httpRoute.enabled }}
{{- $defaultSvcName := printf "%s-%s" (include "websites.fullname" $) ((index $.Values.services 0).name) | trunc 63 | trimSuffix "-" }}
{{- $defaultSvcPort := (index (index $.Values.services 0).ports 0).port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "websites.fullname" . }}
  namespace: {{ include "websites.namespace" . }}
  labels:
    {{- include "websites.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
        {{- else }}
        - name: {{ $defaultSvcName }}
          port: {{ $defaultSvcPort }}
        {{- end }}
    {{- end }}
{{- end }}
