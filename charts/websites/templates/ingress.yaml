{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "websites.fullname" . }}
  namespace: {{ include "websites.namespace" . }}
  labels:
    {{- include "websites.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- $defaultSvcName := printf "%s-%s" (include "websites.fullname" $) ((index $.Values.services 0).name) | trunc 63 | trimSuffix "-" }}
    {{- $defaultSvcPort := (index (index $.Values.services 0).ports 0).port }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $backend := .backend | default dict }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ dig "service" "name" $defaultSvcName $backend }}
                port:
                  number: {{ dig "service" "port" "number" $defaultSvcPort $backend }}
          {{- end }}
    {{- end }}
{{- end }}
