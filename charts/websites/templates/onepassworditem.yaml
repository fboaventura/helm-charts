{{- range .Values.onePasswordItems }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .name }}
  namespace: {{ include "websites.namespace" $ }}
  labels:
    {{- include "websites.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  itemPath: {{ .itemPath | quote }}
{{- end }}
