# Default values for websites.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace:
  # Set to true to have Helm create the namespace. Set to false to use an existing one.
  create: false
  # Override the namespace name. Defaults to the Helm release namespace (--namespace flag).
  name: ""

replicaCount: 2

image:
  repository: nginx
  # Leave empty to auto-detect: Always for 'latest' tags, IfNotPresent otherwise.
  pullPolicy: ""
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Websites do not need Kubernetes API access. Keep false unless explicitly required.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Enforce seccomp at the pod level. Uncomment runAsNonRoot/fsGroup for hardened deployments.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # runAsNonRoot: true
  # runAsUser: 1000
  # fsGroup: 1000

# Drop all capabilities and block privilege escalation for every container.
# Enable readOnlyRootFilesystem together with appropriate emptyDir volumeMounts.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Spread replicas across nodes when no explicit affinity is configured.
podAntiAffinity: true

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Seconds a pod must be Running and Ready before it counts as available.
# Adds a buffer between probes passing and old pods being terminated.
minReadySeconds: 10

# Delay SIGTERM handling so iptables rules propagate before the container stops
# accepting connections. Prevents in-flight request drops during rolling updates.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

env_vars: []
# Supports both plain values and valueFrom references:
# - name: APP_ENV
#   value: production
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password
# - name: CONFIG_KEY
#   valueFrom:
#     configMapKeyRef:
#       name: my-config
#       key: key

# Inject entire Secrets or ConfigMaps as environment variables.
# Use this to consume secrets created by the SOPS or 1Password operators.
envFrom: []
# - secretRef:
#     name: my-release-websites   # K8s Secret created by SopsSecret operator
# - secretRef:
#     name: my-app-db-creds       # K8s Secret created by OnePasswordItem operator
# - configMapRef:
#     name: my-release-websites   # ConfigMap created by this chart

# Init containers run to completion before the main container starts.
# Useful for database migrations, certificate setup, or pre-startup scripts.
initContainers: []
# - name: migrate
#   image: "myapp:latest"
#   command: ["./manage.py", "migrate"]
#   envFrom:
#     - secretRef:
#         name: my-app-db-creds

services:
  - name: http-svc
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute — alternative to Ingress for clusters running the Kubernetes Gateway API.
# parentRefs points to an existing Gateway resource (managed outside this chart).
# ingress and httpRoute are independent: enable whichever the cluster supports.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: my-gateway        # required: Gateway resource name
  #   namespace: infra        # optional: omit if same-namespace as the route
  #   sectionName: https      # optional: target a specific listener
  hostnames: []
  # - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs: []         # leave empty to auto-resolve to services[0]

# Resource requests are required for HPA CPU autoscaling to function.
resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

# Gives slow-starting containers time to initialise before liveness kicks in.
# failureThreshold * periodSeconds = maximum startup budget (default: 150s).
startupProbe:
  httpGet:
    path: /
    port: http
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Use either minAvailable or maxUnavailable, not both.

networkPolicy:
  enabled: false
  # Restrict ingress to specific sources (e.g. the ingress-nginx namespace).
  # Leave empty to allow traffic from all pods in the cluster.
  ingressFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: ingress-nginx
  # Allow egress beyond DNS. Leave empty to deny all non-DNS egress.
  egressTo: []
  # - ports:
  #   - port: 443
  #     protocol: TCP

volumes: []
# - name: tmp
#   emptyDir: {}

volumeMounts: []
# - name: tmp
#   mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

# SOPS Operator (isindir/sops-secrets-operator) — creates a SopsSecret CRD.
# Each secretTemplate entry becomes a distinct K8s Secret. Values must be
# SOPS-encrypted (ENC[...] format) before committing to git.
sopsSecret:
  enabled: false
  name: ""                # name of the SopsSecret CRD resource (defaults to fullname)
  secretTemplates: []     # each entry produces one K8s Secret
  # - name: my-app-db
  #   stringData:
  #     DB_URL: ENC[AES256_GCM,data:...,type:str]
  # - name: my-app-api
  #   stringData:
  #     API_KEY: ENC[AES256_GCM,data:...,type:str]
  annotations: {}
  labels: {}

# 1Password Kubernetes Operator — creates OnePasswordItem CRDs.
# The operator syncs each vault item as a native K8s Secret with the same name as the item.
onePasswordItems: []
# - name: my-app-db-creds          # name of the resulting K8s Secret
#   itemPath: "vaults/MyVault/items/my-item"
# - name: my-app-api-keys
#   itemPath: "vaults/MyVault/items/api-keys"
#   labels: {}
#   annotations: {}

# ConfigMap for application configuration data (settings files, feature flags, etc.).
configMap:
  enabled: false
  data: {}
  # APP_FEATURE_FLAG: "true"
  # config.yaml: |
  #   key: value

# Prometheus ServiceMonitor — requires kube-prometheus-stack or Prometheus Operator installed.
serviceMonitor:
  enabled: false
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
